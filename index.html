<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glorious Web Search</title>
    <link rel="stylesheet" href="CSS+Js/style.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body>
<div class="topbar">
  <a href="https://www.youtube.com" target="_blank">YouTube</a>
  <a href="https://news.google.com" target="_blank">News</a>
  <a href="https://mail.google.com" target="_blank">Mail</a>
  <a href="https://calendar.google.com" target="_blank">Calendar</a>

  <span class="topbar-right">
    Hello, Comrade <span id="usernameDisplay">Guest</span>
  </span>
</div>
    <center>
    <table width="100%" height="100%">
  <tr>
    <td align="center" valign="middle">

      <!-- YOUR CONTENT START -->
      
      <h1 class="logo-text">
        🌟 Red Star Search!
      </h1>

      <!-- index.html -->
<img src="imgs/logo.png" alt="" class="logo-img">

<div class="search-container">
  <!-- Sửa action trỏ đến file kết quả của bạn -->
  <form action="results.html" method="get">
    <!-- Phải giữ nguyên input hidden CX để Google nhận diện bộ máy của bạn -->
    <input type="hidden" name="cx" value="c5ed00b64fd0146ff" />
    
    <table cellspacing="0" cellpadding="0">
      <tr>
        <td>
          <input type="text" name="q" placeholder="Search the entire web..." style="
            width: 250px;
            padding: 6px;
            border: 1px solid #666;
            box-shadow: inset 0 1px 2px #bbb;">
            
        </td>
        <td style="padding-left: 12px">
          <button type="submit" style="
            padding: 6px 12px;
            border: 1px solid #444;
            background: linear-gradient(to bottom, #f8f8f8, #c0c0c0);
            box-shadow: inset 0 1px 0 #fff;
            cursor: pointer;
            font-size: 14px;">
            <strong>Search</strong>
          </button>
        </td>
      </tr>
    </table>
  </form>
</div>


      <!-- YOUR CONTENT END -->

    </td>
  </tr>
</table>
    </center>
  </body>
</html>

<script>
(function () {

  // =========================
  // 🟥 TITLE SYSTEM
  // =========================
  const query = new URLSearchParams(window.location.search).get('q');
  document.title = query 
    ? query + " — Glorious Red Star! 🌟"
    : "Welcome, Comrade! — Red Star Search 🚩";


  // =========================
  // 🟡 CLEAN STATS FIX (STABLE)
  // =========================
  function fixStats() {
    const el = document.querySelector('.gsc-result-info');

    if (!el || el.dataset.done) return;

    const text = el.innerText;
    const nums = text.match(/[\d,.]+/g);

    if (nums && nums.length >= 2) {
      const count = nums[0];
      const time = nums[nums.length - 1];

      el.innerHTML = `🌟 <b>Report:</b> ${count} glorious results found for the People in ${time} seconds!`;

      el.style.color = "#d93025";
      el.style.fontWeight = "bold";
      el.style.fontFamily = "Arial";

      el.dataset.done = "1";
    }
  }

  setInterval(fixStats, 500);


  // =========================
  // 🔴 R-e-e-e-e-d Star FIX
  // =========================
  function fixPagination() {
    const boxes = document.querySelectorAll('.gsc-cursor-box');

    boxes.forEach(box => {
      if (box.dataset.done) return;

      const pages = box.querySelectorAll('.gsc-cursor-page');
      if (pages.length === 0) return;

      box.innerHTML = "";

      const container = document.createElement("span");
      container.style.fontWeight = "bold";
      container.style.fontSize = "18px";

      container.append("R-");

      pages.forEach(p => {
        const a = document.createElement("a");
        a.href = p.href;
        a.innerText = "e-";
        a.style.margin = "0 2px";
        a.style.textDecoration = "none";
        a.style.color = "#1122cc";
        container.appendChild(a);
      });

      container.append("d Star! 🌟");

      box.appendChild(container);
      box.dataset.done = "1";
    });
  }

  setInterval(fixPagination, 500);


  // =========================
  // 🟢 WELCOME MESSAGE
  // =========================
  function showWelcome() {
    const q = new URLSearchParams(window.location.search).get('q');
    const box = document.querySelector('.results-border-box');

    if (!q && box) {
      box.innerHTML = `
        <div class="welcome-container">
          <h1>Welcome, Comrade! 🌟</h1>
          <p>The Red Star is ready to guide your search.</p>
          <p class="hint">Type something above to begin 🚩</p>
          <div class="star-icon">★</div>
        </div>
      `;
    }
  }

  window.onload = showWelcome;


  // =========================
  // 👤 USERNAME SYSTEM (FIXED)
  // =========================
  const span = document.getElementById("usernameDisplay");
  if (!span) return;

  function enableEdit(el) {
    el.onclick = function () {
      const input = document.createElement("input");
      input.value = el.innerText;
      input.style.fontSize = "13px";
      input.style.border = "1px solid #666";

      el.replaceWith(input);
      input.focus();

      function save() {
        const name = input.value.trim() || "Guest";

        localStorage.setItem("rss_username", name);

        const newSpan = document.createElement("span");
        newSpan.id = "usernameDisplay";
        newSpan.innerText = name;
        newSpan.style.cursor = "pointer";

        input.replaceWith(newSpan);
        enableEdit(newSpan);
      }

      input.onblur = save;
      input.onkeydown = e => {
        if (e.key === "Enter") save();
      };
    };
  }

  // load saved name
  const saved = localStorage.getItem("rss_username");
  if (saved) span.innerText = saved;

  enableEdit(span);

  function fixStats() {
  const el = document.querySelector('.gsc-result-info');
  if (!el) return;

  const text = el.innerText;
  const nums = text.match(/[\d,.]+/g);

  if (nums && nums.length >= 2) {
    const count = nums[0];
    const time = nums[nums.length - 1];

    el.innerHTML = `🌟 <b>Report:</b> ${count} glorious results found for the People in ${time} seconds!`;

    el.style.color = "#d93025";
    el.style.fontWeight = "bold";
    el.style.fontFamily = "Arial";
  }
}

// 🔥 run VERY often to fight Google reload
setInterval(fixStats, 300);
})();
</script>
